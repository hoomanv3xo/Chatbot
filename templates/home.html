<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Cohere Chatbot</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            max-width: 600px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input[type="submit"] {
            background-color: #4caf50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .output-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #4caf50;
        }

        .output-container h2 {
            margin-top: 0;
            color: #4caf50;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .output-body {
            color: #333;
            line-height: 1.7;
            font-size: 15px;
        }

        .output-body p {
            margin-bottom: 12px;
        }

        .output-body ul, .output-body ol {
            padding-left: 20px;
            margin-bottom: 12px;
        }

        .output-body li {
            margin-bottom: 6px;
        }

        .output-body strong {
            color: #222;
        }

        .output-body code {
            background-color: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }

        .output-body pre {
            background-color: #f0f0f0;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🤖 ChatBot</h1>

    <form method="post" action="{{ url_for('home') }}">
        {{ form.hidden_tag() }}
        <label for="text">Ask me anything:</label>
        {{ form.text(size=40, placeholder="Type your message here...") }}
        {{ form.submit() }}
    </form>

    {% if output %}
        <div class="output-container">
            <h2>Response</h2>
            <div class="output-body">{{ output | safe }}</div>
        </div>
    {% endif %}
</body>
</html>
